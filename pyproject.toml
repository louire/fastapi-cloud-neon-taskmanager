[project]
name = "fastapi-cloud-neon-taskmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Loui Recio", email = "lreciopersonal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-cloud-neon-taskmanager = "fastapi_cloud_neon_taskmanager:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
[tool.fastapi]
entrypoint = "main:app"